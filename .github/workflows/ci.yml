name: ci
on:
  push:
    branches: [main]
  pull_request:
  # A Dependabot auto-merge pushes with GITHUB_TOKEN, which starts no workflow, so main can sit
  # on commits CI never ran and the release script waits for a run that never comes. The nightly
  # run checks main within a day of any bot merge; workflow_dispatch lets a person start one now.
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24] # engines.node is >=22; Node 20 reached end of life on 2026-04-30
        include:
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the examples run workproof on this repository's own history
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run examples
  reproducibility:
    # The hash is the promise: the same repository hashes the same for a stranger. This
    # measures one pinned fixture under two directory names on three operating systems and
    # fails if any of them disagrees with the others.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/hash-reproducibility.mjs
        env:
          # The hash of the pinned fixture. It is pinned here on purpose, so that a change in the
          # report's identity has to be noticed and explained rather than drifting quietly.
          # Updating it is not routine: say in the commit why the report changed.
          # Last change: b9f5f75e -> b0331b67 when surviving-lines went 0.1.1 to 0.1.7 (#23). The
          # method line records the dependency's version, the method line is part of the report,
          # and the report is what is hashed, so the identity moved for a real and correct reason.
          # Verified by installing 0.1.1 again and getting b9f5f75e back.
          WORKPROOF_EXPECT: b0331b6705b02fa3ff2c57b1563a9dd53418951ade371a5c2565b712c3028f97
  package:
    # The tarball people install, checked before a tag exists: exports, types, bin, and a real install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx publint --strict
      - run: npx attw --pack . --ignore-rules cjs-resolves-to-esm # ESM only, by design
      - name: Install the packed tarball in an empty project and run it
        run: sh scripts/smoke-tarball.sh
  release-gate:
    # The version the package states is the version every other file states, and npm pack ships only allowlisted paths.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build --if-present
      - run: node scripts/release-gate.mjs
  action:
    # The composite action, run the way a user runs it (uses: ./ on a full-history checkout),
    # but on the package built from this commit instead of the registry version, so a change
    # in src/ that breaks the summary, the artifact or the comment fails here before release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # workproof refuses a shallow clone
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Pack the package built from this commit
        id: pack
        run: echo "tgz=$RUNNER_TEMP/$(npm pack --silent --pack-destination "$RUNNER_TEMP" | tail -1)" >> "$GITHUB_OUTPUT"
      - uses: ./
        id: workproof
        with:
          author: Efe Genc
          package: ${{ steps.pack.outputs.tgz }}
          comment: "false" # this job has no pull-requests write; the comment body is rendered below instead
      - name: Download the artifact the action uploaded
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: workproof-report
          path: ${{ runner.temp }}/artifact
      - name: The outputs, the artifact, the summary source and the comment body all render
        env:
          REPORT: ${{ steps.workproof.outputs.report }}
          ARTIFACT: ${{ runner.temp }}/artifact
        run: |
          set -eu
          test "$REPORT" = workproof-report.json || { echo "outputs.report is '$REPORT'"; exit 1; }
          for f in workproof-report.md workproof-report.json workproof-report.intoto.json workproof-report.predicate.json; do
            test -s "$ARTIFACT/$f" || { echo "artifact is missing $f"; exit 1; }
          done
          node dist/src/cli.js check "$ARTIFACT/workproof-report.json"
          grep -q '^# Engineering report' workproof-report.md || { echo "the summary source has no report heading"; exit 1; }
          node scripts/action-comment.mjs "$REPORT" > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md"
          if grep -Eq 'undefined|NaN' "$RUNNER_TEMP/comment.md"; then echo "the comment printed undefined or NaN"; exit 1; fi
          test "$(grep -c '^| ' "$RUNNER_TEMP/comment.md")" -eq 9 || { echo "the comment table does not have its header and eight rows"; exit 1; }
  ci-ok:
    # The one check the branch ruleset requires; it fails if any job above failed or was cancelled.
    if: always()
    needs: [test, package, release-gate, reproducibility, action]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "test: ${{ needs.test.result }}  package: ${{ needs.package.result }}  release-gate: ${{ needs.release-gate.result }}  reproducibility: ${{ needs.reproducibility.result }}  action: ${{ needs.action.result }}"
          test "${{ needs.test.result }}" = success && test "${{ needs.package.result }}" = success && test "${{ needs.release-gate.result }}" = success && test "${{ needs.reproducibility.result }}" = success && test "${{ needs.action.result }}" = success
