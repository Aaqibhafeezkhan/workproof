name: workproof
description: Run workproof on the checked-out repository, run check, write the in-toto statement, put the Markdown report in the job summary, upload the report files as an artifact, and post the headline figures as a sticky pull-request comment.
author: Efe Genc
branding:
  icon: check-square
  color: blue
inputs:
  author:
    description: Identity to report on, an email or a name as it appears in git log. Required, because a GitHub login does not map reliably onto commit identities.
    required: true
  sample:
    description: Blame every n-th file (1 blames every file).
    required: false
    default: "1"
  comment:
    description: Post or update a sticky comment on the pull request with the summary. Needs permissions pull-requests write and a pull_request event.
    required: false
    default: "true"
  attest:
    description: Sign an in-toto attestation of the report with Sigstore (cosign attest-blob, keyless through the workflow's OIDC identity). Needs permissions id-token write. The Fulcio certificate names this repository and the Rekor entry is public and permanent.
    required: false
    default: "false"
  version:
    description: workproof version to run.
    required: false
    default: "0.5.1"
  package:
    description: A local workproof package to run instead of the registry version, as a path to an npm pack tarball. Empty by default, which runs workproof@<version> from npm. This repository's CI sets it to the tarball built from the commit under test.
    required: false
    default: ""
outputs:
  report:
    description: Path of the JSON report, workproof-report.json, relative to the workspace.
    value: ${{ steps.run.outputs.report }}
  bundle:
    description: Path of the Sigstore bundle, workproof-report.sigstore.json, when attest is "true"; empty otherwise.
    value: ${{ steps.sigstore.outputs.bundle }}
runs:
  using: composite
  steps:
    - name: Run workproof
      id: run
      shell: bash
      env:
        WP_VERSION: ${{ inputs.version }}
        WP_PACKAGE: ${{ inputs.package }}
        WP_AUTHOR: ${{ inputs.author }}
        WP_SAMPLE: ${{ inputs.sample }}
      run: |
        set -euo pipefail
        wp() {
          if [ -n "${WP_PACKAGE}" ]; then npx --yes --package "${WP_PACKAGE}" workproof "$@"
          else npx --yes "workproof@${WP_VERSION}" "$@"; fi
        }
        wp --repo . --author "${WP_AUTHOR}" --sample "${WP_SAMPLE}" --out workproof-report
        wp check workproof-report.json
        wp attest workproof-report.json
        echo "report=workproof-report.json" >> "$GITHUB_OUTPUT"
    - name: Write the report to the job summary
      shell: bash
      run: |
        set -euo pipefail
        cat workproof-report.md >> "$GITHUB_STEP_SUMMARY"
    - name: Upload the report as an artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: workproof-report
        path: |
          workproof-report.md
          workproof-report.json
          workproof-report.intoto.json
          workproof-report.predicate.json
        if-no-files-found: error
    - name: Install cosign
      if: ${{ inputs.attest == 'true' }}
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - name: Attest the report with Sigstore
      id: sigstore
      if: ${{ inputs.attest == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        cosign attest-blob workproof-report.json \
          --predicate workproof-report.predicate.json \
          --type https://github.com/Bubblegunn/workproof/blob/main/docs/attestation-v1.md \
          --bundle workproof-report.sigstore.json \
          --yes
        echo "bundle=workproof-report.sigstore.json" >> "$GITHUB_OUTPUT"
    - name: Comment on the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        marker="<!-- workproof-summary -->"
        body="$(node "$GITHUB_ACTION_PATH/scripts/action-comment.mjs" workproof-report.json)"
        existing="$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)"
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" >/dev/null
        else
          gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
        fi
