name: workproof
description: Run workproof on the checked-out repository, run check, write the in-toto statement, put the Markdown report in the job summary, upload the report files as an artifact, and post the headline figures as a sticky pull-request comment.
author: Efe Genc
branding:
  icon: check-square
  color: blue
inputs:
  author:
    description: Identity to report on, an email or a name as it appears in git log. Required, because a GitHub login does not map reliably onto commit identities.
    required: true
  sample:
    description: Blame every n-th file (1 blames every file).
    required: false
    default: "1"
  comment:
    description: Post or update a sticky comment on the pull request with the summary. Needs permissions pull-requests write and a pull_request event.
    required: false
    default: "true"
  attest:
    description: Sign an in-toto attestation of the report with Sigstore (cosign attest-blob, keyless through the workflow's OIDC identity). Needs permissions id-token write. The Fulcio certificate names this repository and the Rekor entry is public and permanent.
    required: false
    default: "false"
  version:
    description: workproof version to run.
    required: false
    default: "0.5.0"
runs:
  using: composite
  steps:
    - name: Run workproof
      shell: bash
      env:
        WP_VERSION: ${{ inputs.version }}
        WP_AUTHOR: ${{ inputs.author }}
        WP_SAMPLE: ${{ inputs.sample }}
      run: |
        set -euo pipefail
        npx --yes "workproof@${WP_VERSION}" --repo . --author "${WP_AUTHOR}" --sample "${WP_SAMPLE}" --out workproof-report
        npx --yes "workproof@${WP_VERSION}" check workproof-report.json
        npx --yes "workproof@${WP_VERSION}" attest workproof-report.json
        echo "report=workproof-report.json" >> "$GITHUB_OUTPUT"
    - name: Write the report to the job summary
      shell: bash
      run: |
        set -euo pipefail
        cat workproof-report.md >> "$GITHUB_STEP_SUMMARY"
    - name: Upload the report as an artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: workproof-report
        path: |
          workproof-report.md
          workproof-report.json
          workproof-report.intoto.json
          workproof-report.predicate.json
        if-no-files-found: error
    - name: Install cosign
      if: ${{ inputs.attest == 'true' }}
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - name: Attest the report with Sigstore
      if: ${{ inputs.attest == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        cosign attest-blob workproof-report.json \
          --predicate workproof-report.predicate.json \
          --type https://workproof.dev/attestation/v1 \
          --bundle workproof-report.sigstore.json \
          --yes
        echo "bundle=workproof-report.sigstore.json" >> "$GITHUB_OUTPUT"
    - name: Comment on the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        marker="<!-- workproof-summary -->"
        body="$(node -e '
          const r = JSON.parse(require("fs").readFileSync("workproof-report.json", "utf8"));
          const repo = r.repositories[0];
          const f = Object.fromEntries(repo.figures.map((x) => [x.id, x.value]));
          const pct = (x) => (x * 100).toFixed(1) + "%";
          const lines = [
            "<!-- workproof-summary -->",
            "### workproof · " + repo.identity.names.join(", "),
            "",
            "| figure | value |",
            "|---|---|",
            "| Surviving lines | " + f.survivingLines.lines.toLocaleString("en-US") + " of " + f.survivingLines.linesAttributed.toLocaleString("en-US") + ", " + pct(f.survivingLines.share) + " |",
            "| Files authored | " + f.filesAuthored.authored + " of " + f.filesAuthored.total + " alive at HEAD, " + pct(f.filesAuthored.share) + " |",
            "| Tenure window | " + f.tenure.first + " to " + f.tenure.last + " (" + f.tenure.days + " days) |",
            "| Share of commits | " + f.commitShare.author + " of " + f.commitShare.total + ", " + pct(f.commitShare.share) + " |",
            "| Cadence | " + f.cadence.activeWeeks + " active weeks of " + f.cadence.weeksInTenure + ", " + f.cadence.commitsPerActiveWeek + " commits per active week |",
            "| Footprint | " + f.footprint.filesTouched + " files touched, " + f.footprint.ownedDirectories.length + " directories at or above the threshold |",
            "| Test-file changes and documents | " + pct(f.testsAndDocs.testShare) + " of test-file changes, " + f.testsAndDocs.docsCreated + " documents created |",
            "| AI-assisted commits | " + f.aiAssisted.commits + ", " + pct(f.aiAssisted.share) + " of the author's commits |",
            "",
            "excluded " + repo.excluded.botCommits + " bot commits and " + repo.excluded.files + " generated, vendored or lock files · HEAD `" + repo.head.slice(0, 12) + "` · report hash `" + r.hash.slice(0, 16) + "` · `npx workproof check workproof-report.json` recomputes the hash offline, `verify` recomputes the figures. Every figure has a limit; see the report.",
          ];
          process.stdout.write(lines.join("\n"));
        ')"
        existing="$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)"
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" >/dev/null
        else
          gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
        fi
